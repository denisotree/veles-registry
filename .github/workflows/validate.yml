name: validate
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Validate changed extensions
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >
          uvx --python 3.13
          --from 'veles-ai @ git+https://github.com/denisotree/veles@9866626c8bd509740e4b163cf54ffa155580d77a'
          --with pytest --with pytest-asyncio --with respx
          veles registry validate . --run-code --install-requires
          --base "origin/$BASE_REF" --report review.md
      - name: Reviewer report
        if: always()
        run: test -f review.md && cat review.md >> "$GITHUB_STEP_SUMMARY" || true
