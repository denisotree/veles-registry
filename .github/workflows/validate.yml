name: validate
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Validate changed extensions
        env:
          BASE_REF: ${{ github.base_ref }}
        # Until Veles 1.2.3 is on PyPI: the release-B commit these extensions need.
        run: >
          uvx --python 3.13
          --from 'git+https://github.com/denisotree/veles@418fbe6b0da8ea9f76bc4d9c93f3b14d6d4b208a'
          --with pytest --with respx
          veles registry validate . --run-code --install-requires
          --base "origin/$BASE_REF" --report review.md
      - name: Reviewer report
        if: always()
        run: test -f review.md && cat review.md >> "$GITHUB_STEP_SUMMARY" || true
